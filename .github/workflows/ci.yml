name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Client API and admin dashboard tests
        run: npm test
      - name: Require Clerk publishable key
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${VITE_CLERK_PUBLISHABLE_KEY}" ]; then
            echo "::error::BUILD FAILURE: GitHub Actions secret VITE_CLERK_PUBLISHABLE_KEY is missing or empty. WealthPass will not fall back to a password gate."
            exit 1
          fi
      - name: Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build
